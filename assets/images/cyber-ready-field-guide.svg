<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-labelledby="title desc"><title id="title">Operational readiness field guide</title><desc id="desc">A calm annotated diagram of a small business team moving through four practical cybersecurity readiness steps: notice, check, tell and practise.</desc><rect width="620" height="500" rx="18" fill="#fffdf8"/><path d="M62 104h496M62 250h496M62 396h496" stroke="#d8d0c3" stroke-width="2"/><g font-family="Arial, sans-serif" fill="#242522"><text x="58" y="55" font-size="15" font-weight="700" letter-spacing="2">OPERATIONAL READINESS FIELD GUIDE</text><text x="58" y="80" font-size="13" fill="#4b4c47">Build shared habits around the decisions people make each day.</text></g><g><circle cx="126" cy="174" r="52" fill="#e9eee7"/><circle cx="126" cy="161" r="15" fill="#a65a3a"/><path d="M96 211c4-28 56-28 60 0" fill="#6f8879"/><text x="198" y="158" font-family="Georgia,serif" font-size="28" fill="#242522">Notice</text><text x="198" y="184" font-family="Arial,sans-serif" font-size="15" fill="#4b4c47">Unexpected invoice? Strange link?</text><circle cx="510" cy="170" r="23" fill="#f6f1e8" stroke="#a65a3a" stroke-width="3"/><path d="M510 156v16l11 7" fill="none" stroke="#a65a3a" stroke-width="3"/></g><g><rect x="74" y="282" width="105" height="62" rx="8" fill="#f6f1e8" stroke="#6f8879" stroke-width="3"/><path d="M98 310h56M98 326h37" stroke="#6f8879" stroke-width="4"/><text x="198" y="306" font-family="Georgia,serif" font-size="28" fill="#242522">Check</text><text x="198" y="332" font-family="Arial,sans-serif" font-size="15" fill="#4b4c47">Pause and use your agreed pathway.</text><path d="M458 294l48 48M506 294l-48 48" stroke="#a65a3a" stroke-width="4"/><text x="436" y="374" font-family="Arial,sans-serif" font-size="13" fill="#4b4c47">Don’t guess</text></g><g><path d="M90 435h118" stroke="#a65a3a" stroke-width="5"/><path d="M207 435l-16-11m16 11l-16 11" stroke="#a65a3a" stroke-width="5" fill="none"/><text x="238" y="427" font-family="Georgia,serif" font-size="25" fill="#242522">Tell, then practise and refresh</text><text x="238" y="452" font-family="Arial,sans-serif" font-size="15" fill="#4b4c47">Clear contacts and a usable plan make action easier.</text></g></svg>